[config]

[config.custom_colors]
red = "#e06c75"
green = "#98c379"
yellow = "#e5c07b"
blue = "#61afef"
magenta = "#c678dd"
cyan = "#56b6c2"

[templates.waybar]
input_path = "templates/waybar-colors3.css"
output_path = "~/.config/waybar/colors.css"

[templates.rofi]
input_path = "templates/rofi-colors.css"
output_path = "~/.config/rofi/colors.rasi"

[templates.hypr]
input_path = "templates/hyprland-colors.lua"
output_path = "~/.config/hypr/modules/colors.lua"

[templates.gtk3]
input_path = "templates/gtk-colors.css"
output_path = "~/.config/gtk-3.0/colors.css"
post_hook = "gsettings set org.gnome.desktop.interface gtk-theme ''; gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark'"

[templates.gtk4]
input_path = "templates/gtk-colors.css"
output_path = "~/.config/gtk-4.0/colors.css"

[templates.qt5]
input_path = "templates/qt-colors.conf"
output_path = "~/.config/qt5ct/colors/matugen.conf"

[templates.qt6]
input_path = "templates/qt-colors.conf"
output_path = "~/.config/qt6ct/colors/matugen.conf"

[templates.kitty]
input_path = "templates/kitten-colors.conf"
output_path = "~/.config/kitty/matugen.conf"

[templates.starship]
input_path = "templates/starship.toml"
output_path = "~/.config/starship.toml"
post_hook = "fish -c 'set -U theme_reload (random)'"
