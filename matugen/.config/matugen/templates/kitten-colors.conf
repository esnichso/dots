# kitty colors, generated by matugen. Do not edit the output by hand.
# Template: ~/.config/matugen/templates/kitty-colors.conf
# Output:   ~/.config/kitty/colors.conf
#
# Backgrounds use the same secondary tones as the Waybar islands.
# ANSI colors 1-6 come from [config.custom_colors] in matugen's config.toml,
# so red stays red (git diffs, errors) but is blended toward the wallpaper.

# --- ANSI: normal (fixed, vivid) ---
color0                  {{palettes.secondary._25.hex}}
color1                  {{colors.red.default.hex | auto_lightness: 20.0}}
color2                  {{colors.green.default.hex | auto_lightness: 20.0}}
color3                  {{colors.yellow.default.hex | auto_lightness: 20.0}}
color4                  {{colors.blue.default.hex | auto_lightness: 20.0}}
color5                  {{colors.magenta.default.hex | auto_lightness: 20.0}}
color6                  {{colors.cyan.default.hex | auto_lightness: 20.0}}
color7                  {{colors.on_surface_variant.default.hex}}

# --- ANSI: bright ---
color8                  {{palettes.secondary._50.hex}}
color9                  #ff8787
color10                 #69db7c
color11                 #ffd43b
color12                 #74c0fc
color13                 #da77f2
color14                 #3bc9db
color15                 {{colors.on_surface.default.hex}}

# --- ANSI: bright ---
color8                  {{palettes.secondary._50.hex}}
color9                  {{colors.red.default.hex | lighten: 12.0}}
color10                 {{colors.green.default.hex | lighten: 12.0}}
color11                 {{colors.yellow.default.hex | lighten: 12.0}}
color12                 {{colors.blue.default.hex | lighten: 12.0}}
color13                 {{colors.magenta.default.hex | lighten: 12.0}}
color14                 {{colors.cyan.default.hex | lighten: 12.0}}
color15                 {{colors.on_surface.default.hex}}

# --- Tabs ---
tab_bar_background      {{palettes.secondary._10.hex}}
active_tab_background   {{colors.primary_container.default.hex}}
active_tab_foreground   {{colors.on_primary_container.default.hex}}
inactive_tab_background {{palettes.secondary._20.hex}}
inactive_tab_foreground {{colors.on_surface_variant.default.hex}}

# --- Split borders ---
active_border_color     {{colors.primary.default.hex}}
inactive_border_color   {{colors.outline_variant.default.hex}}
bell_border_color       {{colors.error.default.hex}}

